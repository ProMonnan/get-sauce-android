name: Release

# Fires when a `v*` tag is pushed. Builds the Go AAR + Android APKs, then
# publishes a GitHub Release with:
#   * title = "MoeGrab <version>"
#   * body  = the matching section from CHANGELOG.md
#   * assets = moegrab-<version>-<abi>.apk (per-ABI splits + universal)
#
# Workflow for cutting a new release:
#   1. Move "Unreleased" bullets in CHANGELOG.md into a new "## [x.y.z] - YYYY-MM-DD" section
#   2. Bump `versionCode` and `versionName` in android/app/build.gradle.kts
#   3. Commit + push to main
#   4. `git tag vx.y.z && git push origin vx.y.z`
#   5. This workflow runs; ~10 min later the release page is populated

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.tag }}"
          else
            ref="${GITHUB_REF#refs/tags/}"
          fi
          version="${ref#v}"
          echo "ref=$ref"          >> "$GITHUB_OUTPUT"
          echo "name=$ref"         >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 0

      # Pull the matching section out of CHANGELOG.md and stash it as release-body.md.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version='${{ steps.tag.outputs.version }}'
          if [[ ! -f CHANGELOG.md ]]; then
            printf "## MoeGrab %s\n\nAndroid build.\n" "$version" > release-body.md
            exit 0
          fi
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/         { exit }
            grab                     { print }
          ' CHANGELOG.md > extracted.md
          if [[ ! -s extracted.md ]]; then
            printf "## MoeGrab %s\n\nAndroid build.\n" "$version" > release-body.md
          else
            {
              cat extracted.md
              printf "\n---\n\n### Install\n"
              printf "1. Download the APK below. If unsure which one, grab **moegrab-%s-universal.apk** — works on any phone.\n" "$version"
              printf "2. Transfer to your phone (email / Drive / USB).\n"
              printf "3. Tap the APK. On the security prompt, tap **Settings** → allow installs from that source → **Install**.\n"
              printf "4. Open **MoeGrab** → **Settings** → pick an output folder → **Home** → paste a URL → **Fetch info** → **Download**.\n"
            } > release-body.md
          fi
          cat release-body.md

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264"

      - name: Set NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: gomobile init
        run: gomobile init

      - name: Build Go AAR
        env:
          ANDROID_TARGET_ARCHS: "arm64,arm,amd64,386"
        run: bash scripts/build-aar.sh

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build APK
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug

      - name: Stage APKs with versioned names
        run: |
          mkdir -p out
          tag='${{ steps.tag.outputs.name }}'
          for src in android/app/build/outputs/apk/debug/app-*.apk; do
            base=$(basename "$src" .apk)          # app-arm64-v8a-debug
            suffix=${base#app-}                   # arm64-v8a-debug
            suffix=${suffix%-debug}               # arm64-v8a
            [[ -z "$suffix" ]] && suffix="universal"
            cp "$src" "out/moegrab-${tag}-${suffix}.apk"
          done
          ls -lh out

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          name: MoeGrab ${{ steps.tag.outputs.name }}
          body_path: release-body.md
          files: |
            out/moegrab-${{ steps.tag.outputs.name }}-*.apk

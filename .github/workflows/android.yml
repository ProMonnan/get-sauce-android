name: Android

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - "downloader/**"
      - "extractors/**"
      - "merger/**"
      - "static/**"
      - "config/**"
      - "utils/**"
      - "request/**"
      - "parsers/**"
      - "go.mod"
      - "go.sum"
      - "android/**"
      - "scripts/build-aar.sh"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Go + gomobile ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # --- Android SDK + NDK ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264"

      - name: Set NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: gomobile init
        run: gomobile init

      # --- Build AAR ---
      - name: Build Go AAR
        env:
          # Include all 4 ABIs so releases are universal-capable.
          ANDROID_TARGET_ARCHS: "arm64,arm,amd64,386"
        run: ./scripts/build-aar.sh

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: getsauce-aar
          path: android/app/libs/getsauce.aar

      # --- Build APK ---
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: getsauce-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
